name: Atualizar Dashboard

on:
  schedule:
    - cron: '0 */2 * * *' # Roda automaticamente a cada 2 horas
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install psycopg2-binary pandas

      - name: Executar script de geração
        run: python gerar_dashboard.py

      - name: Fazer Deploy para o GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
